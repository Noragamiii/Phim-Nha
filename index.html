  context(){const s=Store.s,p=s.profile||{};const done=LESSONS.filter(l=>s.lessons[l.id]&&s.lessons[l.id].done).map(l=>l.title);const nx=Lessons.next();
    const songs=Object.entries(s.songs).map(([id,r])=>{const so=Songs.byId(id);return so?`${so.title}: ${r.best}%`:null;}).filter(Boolean);
    const acc=k=>{const a=Skills.acc(k);return a==null?'chưa có':Math.round(a*100)+'%';};
    return `Mục tiêu: ${(p.goals||[]).join(', ')||'chưa chọn'}. Thời gian mỗi ngày: ${p.minutes||20} phút. Cách học: ${p.input||'màn hình'}. Biết đọc nốt: ${p.reading||'chưa'}.
Đã xong ${done.length}/${LESSONS.length} bài: ${done.slice(-8).join('; ')||'chưa bài nào'}. Bài tiếp theo: ${nx?nx.title:'đã xong lộ trình'}.
Điểm bài hát: ${songs.join('; ')||'chưa chơi'}. Độ chính xác gần đây: tên phím ${acc('note')}, đọc khuông ${acc('staff')}, nghe ${acc('ear')}, tiết tấu ${acc('rhythm')}. Chuỗi ngày tập: ${App.streak()}.`;},
  render(){const el=$('#coachBody');if(!el)return;
    if(OFFLINE){Tutor.render();return;}
    if(!this.sample){el.innerHTML=`<div class="callout"><p>Thầy AI cần trang được mở bên trong Claude. Nếu bạn đang xem ở đây mà vẫn thấy dòng này, hãy tải lại trang. Mọi phần khác của app vẫn hoạt động bình thường.</p></div>`;return;}
    el.innerHTML=`<p class="lead">Hỏi bất cứ điều gì về đàn: tư thế, kỹ thuật, đọc nốt, chức năng PSR-F52, cách phá băng một bài. Thầy biết tiến độ của bạn trong app.</p>
    <div class="quick">${['Nhận xét tiến độ và cho tôi kế hoạch tuần này','Tay tôi mỏi khi tập, nên làm gì?','Làm sao để chơi được nhạc Ghibli bản dễ nhanh nhất?','Giải thích hợp âm add9 và maj7 thật dễ hiểu','Organ và piano: tôi nên tập gì khác nhau?'].map(q=>`<button class="btn sm ghost" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <div class="chat" id="chat" aria-live="polite">${this.msgs.map(m=>`<div class="msg ${m.role}">${m.role==='user'?esc(m.content):this.fmt(m.content)}</div>`).join('')}</div>
    <form class="ask" id="askForm"><label class="sr" for="askIn">Câu hỏi</label><textarea id="askIn" rows="2" placeholder="Ví dụ: Tại sao ngón 4 của tôi cứ bị sập?"></textarea><button class="btn primary" type="submit" ${this.busy?'disabled':''}>Hỏi</button></form>
    <p class="muted sm">Mỗi câu hỏi dùng hạn mức Claude của bạn. Lần đầu, Claude sẽ hỏi bạn có cho phép không.</p>`;
    $('#askForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#askIn').value.trim();if(v)this.ask(v);});
    $('#askIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=e.target.value.trim();if(v)this.ask(v);}});
    const c=$('#chat');c.scrollTop=c.scrollHeight;},
  fmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*]\s+/gm,'• ').replace(/\n/g,'<br>');},
  async ask(q){if(this.busy||!this.sample)return;this.busy=true;this.msgs.push({role:'user',content:q});this.msgs.push({role:'assistant',content:'…'});this.render();
    const pre=`Bạn là giáo viên piano và organ kiên nhẫn, nói tiếng Việt, xưng "mình", gọi người học là "bạn". Người học là người mới hoàn toàn, dùng đàn Yamaha PSR-F52 (61 phím, C2–C7). Học trong một app có: lộ trình ${LESSONS.length} bài, chế độ Học từng bước cho từng bài, phòng tập nốt rơi (chế độ Chờ nốt/Theo nhịp/Nghe mẫu, chỉnh tốc độ, lặp đoạn), luyện kỹ năng (tìm phím, đọc khuông, tiết tấu, luyện tai), tab Phá băng (vòng hợp âm, ghi giai điệu, gợi ý hợp âm) và mục Bài của tôi để nhập nốt từ sheet.
Quy tắc: trả lời ngắn (tối đa khoảng 180 chữ), cụ thể, có bước làm được ngay; chỉ nhắc tới tính năng app ở trên. Không chép giai điệu hay chuỗi nốt của bài hát còn bản quyền (ví dụ nhạc Ghibli, nhạc pop hiện đại); thay vào đó hướng dẫn cách tự nghe-chép, vòng hợp âm phổ biến, hoặc mua sheet chính thức. Nếu không chắc về một chức năng cụ thể của PSR-F52, nói rõ và khuyên xem sách hướng dẫn trên trang Yamaha. Không chẩn đoán y khoa; đau kéo dài thì khuyên gặp bác sĩ.
Tiến độ hiện tại của người học: ${this.context()}`;
    const hist=this.msgs.slice(0,-1).slice(-7);const input=hist.map((m,i)=>({role:m.role,content:i===0&&m.role==='user'?pre+'\n\nCâu hỏi: '+m.content:m.content}));
    if(input[0].role!=='user')input.shift();if(input.length&&!input[0].content.startsWith('Bạn là'))input[0]={role:'user',content:pre+'\n\nCâu hỏi: '+input[0].content};
    const last=this.msgs[this.msgs.length-1];
    try{const r=await this.sample(input,{cache:false,onText:({text})=>{last.content=text;const c=$('#chat');if(c&&c.lastElementChild){c.lastElementChild.innerHTML=this.fmt(text);c.scrollTop=c.scrollHeight;}}});last.content=r.text;}
    catch(e){last.content=e&&e.code==='not_granted'?'Bạn chưa cho phép dùng Claude trong trang này, nên thầy AI tạm ẩn. Các phần khác vẫn dùng bình thường.':e&&e.code==='rate_limited'?'Đang có quá nhiều câu hỏi cùng lúc. Đợi một chút rồi hỏi lại nhé.':'Chưa lấy được câu trả lời. Thử lại sau ít phút.';if(e&&e.code==='not_granted')this.sample=null;}
    this.busy=false;this.render();}
};

/* ===== Ứng dụng ===== */
const GOALS=[['ghibli','Nhạc phim, kiểu Ghibli'],['classic','Cổ điển nổi tiếng'],['pop','Đệm hát, nhạc pop'],['organ','Organ']];
const TIPS_=0;const TIPS=['Bấm VOICE rồi nhập số trên PSR-F52 để đổi tiếng; danh sách tiếng in ngay trên mặt đàn.','Cắm tai nghe vào đàn khi tập buổi tối; còn khi dùng micro của app thì để loa đàn phát ra ngoài.','Tập 15 phút mỗi ngày hiệu quả hơn 2 tiếng vào cuối tuần: tay “nhớ” qua giấc ngủ.','Gặp đoạn khó: lặp riêng 2 ô nhịp đó ở tốc độ 60% cho tới khi đúng 3 lần liền.','Luôn tập tay phải, rồi tay trái, rồi mới ghép hai tay.','Nhìn trước một nốt: mắt luôn đi trước tay một chút.','Nếu đàn có máy đếm nhịp, hãy bật nó cả khi tập trên đàn thật.'];
const App={dockH(){document.documentElement.style.setProperty('--dockH',($('#dock').offsetHeight||200)+'px');},handler:null,view:'today',reduced:matchMedia('(prefers-reduced-motion: reduce)').matches,
  setHandler(h){if(this.handler&&this.handler!==h&&this.handler.destroy&&this.handler!==Player)this.handler.destroy();this.handler=h;},
  go(v){if(v!==this.view){
      if(this.view==='songs'&&Player.song)Player.close();if(this.view==='songs'&&this.handler===StepEd){this.handler=null;}if(this.view==='path')Lessons.close(),$('#lessonPanel').hidden=true,$('#pathList').hidden=false;
      if(this.view==='skills')Skills.close(),$('#skillPanel').hidden=true,$('#skillsList').hidden=false;if(this.view==='explore'){Explore.stop();KB.clear('scale','tgtR','tgtL');}
      this.handler=null;}
    this.view=v;$$('main > section').forEach(s=>s.hidden=s.id!=='view-'+v);$$('nav [data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===v?'page':'false'));
    if(v==='explore'){Explore.render();}if(v==='coach')Coach.render();if(v==='today')this.renderToday();if(v==='path'&&!Lessons.cur)Lessons.renderPath();if(v==='songs'&&!Player.song)this.renderSongList();if(v==='skills'&&!Skills.runner)Skills.render();
    $('main').scrollTop=0;},
  setVoice(v,temp){Store.s.settings.voice=v;$('#voiceSel').value=v;if(!temp)Store.save();},
  renderSongList(){if(!Player.song)Songs.renderList();},
  refreshAll(){KB.layout();KB.labels();$('#voiceSel').value=Store.s.settings.voice;this.updateHeader();this.renderToday();Lessons.renderPath();Skills.render();this.renderSongList();this.syncLabelSeg();},
  syncLabelSeg(){$$('#lblSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lbl===Store.s.settings.labels));},
  streak(){let n=0;const d=new Date();for(let i=0;i<400;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if((Store.s.days[k]||0)>=1)n++;else if(i>0)break;d.setDate(d.getDate()-1);}return n;},
  updateHeader(){$('#streak').textContent=this.streak();$('#xp').textContent=Store.s.xp||0;},
  markPlan(key){const p=Store.s.plan;if(p.date!==todayKey()){p.date=todayKey();p.done=[];}if(!p.done.includes(key)){p.done.push(key);Store.save();}if(this.view==='today')this.renderToday();},
  weakest(){const S=Store.s.lessons;const un={note:S.findc&&S.findc.done,staff:S.treble&&S.treble.done,ear:S['ear-iv']&&S['ear-iv'].done,rhythm:S.rhythm1&&S.rhythm1.done};
    let best={k:'note',a:2};for(const k in un){if(!un[k])continue;const a=Skills.acc(k);const v=a==null||(Store.s.stats[k]||[]).length<5?0.6:a;if(v<best.a)best={k,a:v};}
    const map={note:['find','Tìm phím nhanh'],staff:[Math.random()<0.5?'treble':'bass','Đọc khuông'],ear:[pick(['interval','echo','quality']),'Luyện tai'],rhythm:['rhythm','Tiết tấu']};return {id:map[best.k][0],name:map[best.k][1],acc:best.a};},
  recSong(){const p=Store.s.profile||{};const goals=p.goals||[];const st=Lessons.stageOf();const maxLv=st<=2?1:st===3?2:st<=5?3:st===6?4:5;
    const tagFor={ghibli:'Kiểu nhạc phim',classic:'Cổ điển',organ:'Organ',pop:'Lễ hội'};const want=goals.map(g=>tagFor[g]);
    const c=SONGS.filter(s=>!s.ex&&s.level<=maxLv).map(s=>{const r=Store.s.songs[s.id]||{};let sc=(r.stars||0)*2-(s.level);if(s.tags.some(t=>want.includes(t)))sc-=2.5;if(!r.plays)sc-=0.5;return {s,sc};}).sort((a,b)=>a.sc-b.sc);
    return c.length?c[0].s:SONGS[0];},
  plan(){const p=Store.s.profile||{minutes:20,goals:[]};const M=p.minutes||20;const nx=Lessons.next();const wk=this.weakest();const song=this.recSong();const r=Store.s.songs[song.id]||{};
    const items=[{key:'warm',title:'Khởi động ngón',desc:'5 ngón hai tay, chậm và đều',min:M>=30?4:2,act:`data-skill="warm"`}];
    const ld=Store.s.plan.date===todayKey()&&Store.s.plan.done.includes('lesson');
    if(nx)items.push({key:'lesson',title:ld?'Đã học xong một bài hôm nay':'Bài học: '+nx.title,desc:ld?'Còn sức thì học tiếp: '+nx.title:'Chặng '+nx.stage+' · '+STAGES.find(s=>s.id===nx.stage).title,min:Math.round(M*0.35),act:`data-lesson="${nx.id}"`});
    const L2=Store.s.lessons;if(L2.lhpos&&L2.lhpos.done){const ex=SONGS.filter(s=>s.ex).sort((a,b)=>a.ex-b.ex).find(s=>((Store.s.songs[s.id]||{}).stars||0)<2);if(ex)items.push({key:'hands2',title:'Luyện ngón hai tay: '+ex.title,desc:'Bài '+ex.ex+'/8 · từng bước: tay phải, tay trái, ghép chậm',min:Math.max(3,Math.round(M*0.15)),act:`data-act="guide" data-song="${ex.id}"`});}
    items.push({key:'skill',title:'Ôn: '+wk.name,desc:wk.acc<=1?'Phần bạn đang yếu nhất theo kết quả gần đây':'Làm quen với tên các phím',min:Math.max(3,Math.round(M*0.2)),act:`data-skill="${wk.id}"`});
    const sdesc=!r.best?'Học từng bước: nghe trước, tập từng đoạn, rồi ghép hai tay':r.best<70?`Lần trước ${r.best}%. Học tiếp từng bước cho chắc`:`Lần trước ${r.best}%. Mục tiêu: ${r.best>=90?'tăng tốc độ thêm 10%':'vượt '+Math.min(100,r.best+10)+'%'}`;
    items.push({key:'song',title:'Bài hát: '+song.title,desc:sdesc,min:Math.round(M*0.3),act:(r.best||0)<70?`data-act="guide" data-song="${song.id}"`:`data-act="openSong" data-song="${song.id}"`});
    if(M>=20&&((p.goals||[]).some(g=>g==='ghibli'||g==='pop'))&&Lessons.stageOf()>=4)items.push({key:'explore',title:'Phá băng: chơi cùng vòng hợp âm',desc:'Tay trái đệm, tay phải ứng tác trên các nốt được tô',min:5,act:`data-go="explore"`});
    return items;},
  renderToday(){
    const el=$('#todayBody');if(!el)return;const p=Store.s.profile;const done=Store.s.plan.date===todayKey()?Store.s.plan.done:[];
    const mins=Math.round(Store.s.days[todayKey()]||0);const items=this.plan();const nDone=items.filter(i=>done.includes(i.key)).length;
    const totalDone=LESSONS.filter(l=>Store.s.lessons[l.id]&&Store.s.lessons[l.id].done).length;const M=(p&&p.minutes)||20;const scale=20/M;
    let wk=0;const road=STAGES.map(st=>{const ls=LESSONS.filter(l=>l.stage===st.id);const d=ls.filter(l=>Store.s.lessons[l.id]&&Store.s.lessons[l.id].done).length;const w0=wk+1;wk+=st.weeks*scale;
      return `<li class="${d===ls.length?'done':''}"><span class="rn">${st.id}</span><span class="rt">${esc(st.title)}</span><span class="rb"><i style="width:${100*d/ls.length}%"></i></span><span class="muted sm">tuần ${Math.round(w0)}–${Math.max(Math.round(w0),Math.round(wk))}</span></li>`;}).join('');
    const tip=TIPS[new Date().getDate()%TIPS.length];
    el.innerHTML=`
    <div class="hello"><div><h2>${nDone===items.length?'Xong kế hoạch hôm nay':'Buổi tập hôm nay'}</h2><p class="muted">${M} phút · đã tập ${mins} phút hôm nay · chuỗi ${this.streak()} ngày</p></div>
      <button class="btn ghost sm" data-act="profile">Đổi mục tiêu</button></div>
    <ol class="plan">${items.map(it=>`<li class="${done.includes(it.key)?'done':''}"><span class="pm">${it.min}′</span><div><b>${esc(it.title)}</b><span class="muted sm">${esc(it.desc)}</span></div><button class="btn sm ${done.includes(it.key)?'ghost':'primary'}" ${it.act}>${done.includes(it.key)?(it.key==='lesson'?'Học tiếp':'Tập thêm'):'Bắt đầu'}</button></li>`).join('')}</ol>
    <p class="muted sm">Kế hoạch đổi theo kết quả của bạn: phần nào sai nhiều sẽ được đưa vào mục Ôn.</p>
    <section class="panel"><div class="row-between"><h3>Lộ trình của bạn</h3><span class="muted sm">${totalDone}/${LESSONS.length} bài</span></div>
      <ol class="road">${road}</ol>
      <p class="sm">Với ${M} phút mỗi ngày, bạn có thể chơi được bản phối piano dễ (easy arrangement) của nhạc phim sau khoảng <b>tuần ${Math.round(16*scale)}–${Math.round(20*scale)}</b>, và tự phá băng giai điệu đơn giản từ chặng 6. Bản phối gốc đầy đủ thường cần thêm 6–12 tháng luyện đều.</p></section>
    <section class="panel tipbox"><h3>Mẹo hôm nay</h3><p>${esc(tip)}</p></section>
    ${Backup.html()}
    <p class="muted sm" id="syncNote">Tiến độ được lưu trên trình duyệt này${OFFLINE?'. Dùng Sao lưu để chuyển sang máy khác.':'.'}</p>`;
    if(Store.ref)$('#syncNote').textContent='Tiến độ được lưu vào tài khoản Claude của bạn';
  },
  onboard(force){const p=Store.s.profile||{goals:['ghibli'],minutes:20,input:'mic',reading:'no'};const dlg=$('#onboard');
    dlg.innerHTML=`<form method="dialog" id="obForm"><h2>Chào bạn! Mình cá nhân hóa lớp đàn nhé</h2>
    <fieldset><legend>Bạn muốn chơi được gì nhất? (chọn nhiều)</legend><div class="chipsel">${GOALS.map(g=>`<label><input type="checkbox" name="goal" value="${g[0]}" ${p.goals.includes(g[0])?'checked':''}><span>${g[1]}</span></label>`).join('')}</div></fieldset>
    <fieldset><legend>Mỗi ngày bạn tập được bao lâu?</legend><div class="chipsel">${[10,20,30,45].map(m=>`<label><input type="radio" name="min" value="${m}" ${p.minutes===m?'checked':''}><span>${m} phút</span></label>`).join('')}</div></fieldset>
    <fieldset><legend>Bạn sẽ tập thế nào?</legend><div class="chipsel col">
      <label><input type="radio" name="input" value="mic" ${p.input==='mic'?'checked':''}><span>Đánh trên PSR-F52, app nghe qua micro</span></label>
      <label><input type="radio" name="input" value="self" ${p.input==='self'?'checked':''}><span>Đánh trên PSR-F52, tự nhìn và tự kiểm tra</span></label>
      <label><input type="radio" name="input" value="screen" ${p.input==='screen'?'checked':''}><span>Bấm trên màn hình hoặc bàn phím máy tính</span></label></div></fieldset>
    <fieldset><legend>Bạn đọc được nốt nhạc chưa?</legend><div class="chipsel">${[['no','Chưa'],['some','Một chút'],['yes','Đọc được']].map(x=>`<label><input type="radio" name="read" value="${x[0]}" ${p.reading===x[0]?'checked':''}><span>${x[1]}</span></label>`).join('')}</div></fieldset>
    <div class="controls end"><button class="btn primary" value="ok">Lập kế hoạch cho tôi</button></div></form>`;
    $('#obForm').addEventListener('submit',e=>{const f=e.target;const goals=$$('input[name=goal]:checked',f).map(x=>x.value);
      Store.s.profile={goals:goals.length?goals:['ghibli'],minutes:+($('input[name=min]:checked',f)||{value:20}).value,input:($('input[name=input]:checked',f)||{value:'screen'}).value,reading:($('input[name=read]:checked',f)||{value:'no'}).value};

    if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');},
  init(){
    Store.loadLocal();
    if(Store.s.plan.date!==todayKey())Store.s.plan={date:todayKey(),done:[]};
    KB.build();Roll.show(false);this.syncLabelSeg();$('#voiceSel').value=Store.s.settings.voice;$('#vol').value=Store.s.settings.vol;
    this.go('today');Lessons.renderPath();Skills.render();this.updateHeader();
    if(!Store.s.profile)setTimeout(()=>this.onboard(),300);
    setTimeout(()=>KB.scrollTo(48,72,false),100);
    document.addEventListener('click',e=>this.click(e));
    $('#lblSeg').addEventListener('click',e=>{const b=e.target.closest('[data-lbl]');if(!b)return;Store.s.settings.labels=b.dataset.lbl;Store.save();KB.labels();this.syncLabelSeg();});

    $('#vol').addEventListener('input',e=>{AudioEng.setVol(+e.target.value);});
    $('#vol').addEventListener('change',()=>Store.save());
    $('#micBtn').addEventListener('click',()=>Mic.toggle());
    $('#micSet').addEventListener('click',()=>MicPanel.open());
    const bb=$('#bigBtn');bb.setAttribute('aria-pressed',!!Store.s.settings.big);bb.addEventListener('click',()=>{Store.s.settings.big=!Store.s.settings.big;bb.setAttribute('aria-pressed',Store.s.settings.big);Store.save();KB.layout();setTimeout(()=>KB.scrollTo(55,72,false),30);});
    document.addEventListener('change',e=>{if(e.target.id==='bkFile'&&e.target.files[0]){e.target.files[0].text().then(t=>{$('#bkIn').value=t;Backup.doImport(t);});}});
    if(OFFLINE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});$('#midiBtn').addEventListener('click',()=>Midi.connect());
    $('#octDown').addEventListener('click',()=>Input.shiftOct(-1));$('#octUp').addEventListener('click',()=>Input.shiftOct(1));
    $('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';});
    setInterval(()=>{if(Date.now()-Input.lastAt<30000&&document.visibilityState==='visible'){const k=todayKey();Store.s.days[k]=(Store.s.days[k]||0)+0.25;Store.save();this.updateHeader();}},15000);
    window.addEventListener('resize',()=>Roll.resize());
    Store.connect();Coach.init();
  },
  click(e){
    const t=e.target.closest('[data-go],[data-lesson],[data-song],[data-act],[data-skill],[data-edit],[data-xk],[data-xm],[data-xc],[data-xr],[data-xi],[data-q],[data-step],[data-fb],[data-se],[data-seh],[data-sed],[data-sef],[data-sei]');if(!t)return;
    const d=t.dataset;AudioEng.init();
    if(this.handler===StepEd&&StepEd.click(t))return;
    if(d.go){this.go(d.go);return;}
    if(d.skill){Skills.open(d.skill);return;}
    if(d.lesson&&!d.act){Lessons.open(d.lesson);return;}
    if(d.song&&!d.act){const s=Songs.byId(d.song);if(s)Player.open(s);return;}
    if(d.edit){if(this.handler===StepEd)this.handler=null;Songs.editor(d.edit);return;}
    if(d.xk!==undefined){Explore.key=+d.xk;Explore.render();return;}if(d.xm!==undefined){Explore.minor=d.xm==='1';Explore.prog=0;Explore.render();return;}
    if(d.xc!==undefined){Explore.playChord(+d.xc);return;}if(d.xr){Explore.recMode=d.xr;Explore.render();return;}if(d.xi!==undefined){Explore.cycleDur(+d.xi);return;}
    if(d.q){if(OFFLINE){App.go('coach');Tutor.ask(d.q);}else Coach.ask(d.q);return;}
    if(d.step!==undefined&&Player.song){Guide.apply(Player,+d.step);$('#playerPanel').scrollIntoView({block:'start',behavior:App.reduced?'auto':'smooth'});return;}
    if(d.fb!==undefined&&Player.fb){Analyzer.apply(Player,Player.fb[+d.fb]);return;}
    switch(d.act){
      case 'openSong':{const s=Songs.byId(d.song);if(s){const l=d.lesson?LESSONS.find(x=>x.id===d.lesson):null;Player.open(s,l?{lesson:l.id,minScore:l.task.min,hands:l.task.hands}:{});}break;}
      case 'guide':{const s=Songs.byId(d.song);if(s){const l=d.lesson?LESSONS.find(x=>x.id===d.lesson):null;Player.open(s,{guide:true,...(l?{lesson:l.id,minScore:l.task.min}:{})});}break;}
      case 'stepEd':{this.go('songs');if(Player.song)Player.close();StepEd.open(d.id||null);break;}
      case 'midiImport':MidiImport.pick(d.wi);break;case 'midiPick':MidiImport.pick(null);break;case 'midiOpen':MidiImport.wish=null;MidiImport.form(d.fid);break;
      case 'midiDel':if(confirm('Xóa file này khỏi Hộp MIDI? Các bài đã lấy đoạn vẫn giữ nguyên.')){MidiBox.remove(d.fid);Songs.renderList();}break;
      case 'midiPaste':{const b=$('#mPaste');b.hidden=!b.hidden;if(!b.hidden){const t=$('#mPasteT');t.focus();t.oninput=()=>{const v=t.value;t.value='';MidiBox.paste(v);};}break;}
      case 'midiSave':MidiImport.save();break;case 'midiHear':MidiImport.hear();break;case 'midiCancel':$('#editor').innerHTML='';break;
      case 'wishAdd':{const t=($('#wishT').value||'').trim();if(!t){toast('Nhập tên bài trước.');break;}Wish.list().push({lv:+$('#wishL').value||1,t,c:($('#wishC').value||'').trim(),f:'',song:'',mine:true});Store.s.wishOpen=true;Store.save();Songs.renderList();break;}
      case 'wishDel':{Wish.list().splice(+d.wi,1);Store.s.wishOpen=true;Store.save();Songs.renderList();break;}
      case 'nextLesson':{const n=Lessons.next();if(n)Lessons.open(n.id);break;}
      case 'backSongs':Player.close();this.renderSongList();break;
      case 'backPath':Lessons.close();$('#lessonPanel').hidden=true;$('#pathList').hidden=false;Lessons.renderPath();this.handler=null;break;
      case 'backSkills':Skills.close();$('#skillPanel').hidden=true;$('#skillsList').hidden=false;Skills.render();this.handler=null;break;
      case 'pPlay':Player.toggle();break;
      case 'pRestart':Player.stop();$('#pPlay').textContent='Bắt đầu';$('#pResult').innerHTML='';break;
      case 'pLoop':{const a=+$('#pLf').value,b=+$('#pLt').value;if(a>=1&&b>=a){Player.setLoop(a,b);$('#pPlay').textContent='Bắt đầu';toast(`Lặp ô ${a}–${b}`);}break;}
      case 'pUnloop':Player.setLoop(null);$('#pPlay').textContent='Bắt đầu';break;
      case 'newSong':Songs.editor(null);break;
      case 'eCheck':{const r=Songs.check(Songs.readEditor());$('#eMsg').textContent=r.msg;break;}
      case 'eHear':Songs.hear();break;case 'eSave':Songs.save(d.id||null);break;
      case 'eDel':if(confirm('Xóa bài này?')){Store.s.custom=Store.s.custom.filter(x=>x.id!==d.id);delete Store.s.songs[d.id];(Store.s.wish||[]).forEach(w=>{if(w.song===d.id)w.song='';});Store.save();$('#editor').innerHTML='';Songs.renderList();}break;
      case 'profile':this.onboard(true);break;
      case 'xPlay':Explore.toggle();break;case 'xRec':Explore.recToggle();break;case 'xRecPlay':Explore.recPlay();break;
      case 'xRecUndo':Explore.rec.pop();Explore.recChords=null;Explore.render();break;case 'xRecClear':Explore.rec=[];Explore.recChords=null;Explore.render();break;
      case 'bkCopy':Backup.copy();break;case 'bkDl':Backup.download();break;case 'bkImport':Backup.doImport($('#bkIn').value);break;
      case 'xSuggest':Explore.suggest();break;case 'xSave':Explore.save();break;
    }
  }
};
document.addEventListener('change',e=>{if(e.target.matches('[data-xb]')&&Explore.recChords){Explore.recChords[+e.target.dataset.xb]=+e.target.value;}});
document.addEventListener('toggle',e=>{if(e.target.id==='wishBox'){Store.s.wishOpen=e.target.open;}},true);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>App.init());else App.init();

</script>
</body>
</html>
